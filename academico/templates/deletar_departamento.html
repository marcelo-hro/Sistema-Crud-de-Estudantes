<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Deletar Departamento</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5 p-4 bg-light text-center shadow-sm" style="max-width: 500px; border-radius: 10px; border: 1px solid #ccc;">
    <h1 class="bg-danger text-white p-2 rounded">Deletar Departamento</h1>
    
    <p class="mt-4" style="font-size: 1.2rem;">
        Tem certeza que deseja apagar o departamento <strong>{{ departamento.nome }}</strong> (Código: {{ departamento.codigo }})?
    </p>
    
    <form method="post" class="mt-4">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sim, apagar definitivamente</button>
        <a href="/academico/listar/departamento/" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
