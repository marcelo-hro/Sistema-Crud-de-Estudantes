<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Listagem de Professores</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5 bg-light" style="border:1px solid ; background-color:#1111; border-radius: 10px;">
    <h1 class="m-4 text-center">Registros de Professores <a href="/adicionar/professor/" class="btn btn-primary">Adicionar Professor</a></h1>
    <table class="table table-bordered">
        <tr class="bg-info text-white text-center ">
            <td> Matrícula </td>
            <td> Nome </td>
            <td> Email </td>
            <td> CPF </td>
            <td> Ações </td>
        </tr>
        {% for reg in registros %}
        <tr class="text-center">
            <td>{{ reg.matricula }}</td>
            <td>{{ reg.nome }}</td>
            <td>{{ reg.email }}</td>
            <td>{{ reg.cpf }}</td>
            <td> 
                <a href="/editar/professor/{{reg.id}}/" class="btn btn-success">Editar</a>/
                <a href="/deletar/professor/{{reg.id}}/" class="btn btn-danger">Apagar</a>/
                <a href=/visualizar/professor/{{reg.id}}/" class="btn btn-primary">Ver</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
</body>
</html>
