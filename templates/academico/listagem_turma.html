<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Listagem de Turmas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5 bg-light" style="border:1px solid ; background-color:#1111; border-radius: 10px;">
    <h1 class="m-4 text-center">Registros de Turmas <a href="/adicionar/turma/" class="btn btn-primary">Adicionar Turma</a></h1>
    <table class="table table-bordered">
        <tr class="bg-info text-white text-center">
            <td> ID </td>
            <td> Código </td>
            <td> Ano de Ingresso </td>
            <td> Período </td>
            <td> Curso </td>
            <td> Ações </td>
        </tr>
        {% for reg in registros %}
        <tr class="text-center">
            <td>{{ reg.id }}</td>
            <td>{{ reg.codigo }}</td>
            <td>{{ reg.anoIngresso }}</td>
            <td>{{ reg.periodo }}</td>
            <td>{{ reg.curso }}</td>
            <td> 
                <a href="/editar/turma/{{reg.id}}" class="btn btn-success">Editar</a> /
                <a href="/deletar/turma/{{reg.id}}" class="btn btn-danger">Apagar</a> /
                <a href="/visualizar/turma/{{reg.id}}" class="btn btn-primary">Ver</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
</body>
</html>
