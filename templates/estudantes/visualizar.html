<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Visualizar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container-fluid my-5">
    <div class="w-50 m-auto p-4 bg-info ">
        <h2 class="text-center mt-4"> Dados do Estudante</h2>
        <table class="table bg-white">
            <tr>
                <th>Foto</th>
                <td><img src="/midia/{{estudante.foto}}" class="rounded d-block" height="100px" width="120px"></td>
            </tr>
            <tr>
                <th>Nome</th>
                <td>{{estudante.nome}}</td>
            </tr><tr>
                <th> Email </th>
                <td>{{estudante.email}}</td>
            </tr>
            <tr>
                <th> Senha</th>
                <td>{{estudante.senha}}</td>
            </tr>
            <tr>
                <th>Celular</th>
                <td>{{estudante.telefone}}</td>
            </tr>
            <tr>
                <th>Data de Nascimento</th>
                <td>{{estudante.nascimento}}</td>
            </tr>
        </table>
    </div>
    <div class="text-center">
        </button><a href="/" class="btn btn-success"> Voltar </button></a>
    </div>
</div>
</body>
</html>
