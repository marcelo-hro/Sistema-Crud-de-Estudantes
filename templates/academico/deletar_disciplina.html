<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Deletar Disciplina</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5 bg-light p-4 shadow-sm" style="max-width: 500px; border-radius: 10px; border: 1px solid #ccc;">
    <h2 class="text-center text-danger mb-4">Atenção!</h2>
    <p class="text-center">Tem certeza que deseja apagar a disciplina <strong>{{ disciplina.nome }}</strong>?</p>
    <p class="text-center text-muted">Esta ação não poderá ser desfeita.</p>
    
    <form method="POST" class="text-center mt-4">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sim, apagar disciplina</button>
        <a href="/listar/disciplina/" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
