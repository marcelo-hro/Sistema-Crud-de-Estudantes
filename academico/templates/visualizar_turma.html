<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Detalhes da Turma</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5 bg-light p-4 shadow-sm" style="max-width: 600px; border-radius: 10px; border: 1px solid #ccc;">
    <h1 class="text-center bg-info text-white p-2 rounded mb-4">Detalhes da Turma</h1>
    
    <ul class="list-group">
        <li class="list-group-item"><strong>ID no Banco:</strong> {{ turma.id }}</li>
        <li class="list-group-item"><strong>Código da Turma:</strong> {{ turma.codigo }}</li>
        <li class="list-group-item"><strong>Ano de Ingresso:</strong> {{ turma.anoIngresso }}</li>
        <li class="list-group-item"><strong>Período:</strong> {{ turma.periodo }}</li>
        <li class="list-group-item"><strong>Curso Vinculado:</strong> {{ turma.curso }}</li>
    </ul>
    
    <div class="text-center mt-4">
        <a href="/editar/turma/{{ turma.id }}/" class="btn btn-success">Editar Turma</a>
        <a href="/listar/turma" class="btn btn-secondary">Voltar para a Lista</a>
    </div>
</div>
</body>
</html>
