<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Visualizar Professor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container-fluid my-5">
    <div class="w-50 m-auto p-4 bg-info" style="border-radius: 10px;">
        <h2 class="text-center mt-2 mb-4 text-white"> Dados do Professor</h2>
        <table class="table bg-white">
            <tr>
                <th>Matrícula</th>
                <td>{{ professor.matricula }}</td>
            </tr>
            <tr>
                <th>Nome</th>
                <td>{{ professor.nome }}</td>
            </tr>
            <tr>
                <th>Email</th>
                <td>{{ professor.email }}</td>
            </tr>
            <tr>
                <th>CPF</th>
                <td>{{ professor.cpf }}</td>
            </tr>
        </table>
        
        <div class="text-center mt-3">
            <a href="/academico/listar/professor/" class="btn btn-success"> Voltar </a>
        </div>
    </div>
</div>
</body>
</html>
