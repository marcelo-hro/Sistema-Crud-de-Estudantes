<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Listagem de Cursos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5 bg-light" style="border:1px solid ; background-color:#1111; border-radius: 10px;">
    <h1 class="m-4 text-center">Registros de Cursos <a href="/academico/adicionar/curso/" class="btn btn-primary">Adicionar Curso</a></h1>
    <table class="table table-bordered">
        <tr class="bg-info text-white text-center ">
            <td> Código </td>
            <td> Nome </td>
            <td> Foto </td>
            <td> Duração </td>
            <td> Início </td>
            <td> Carga Horária </td>
            <td> Ações </td>
        </tr>
        {% for reg in registros %}
        <tr class="text-center">
            <td>{{ reg.codigo }}</td>
            <td>{{ reg.nome }}</td>
            <td><img src="/midia/{{ reg.foto }}" class="rounded-circle" height="70px" width="70px"></td>
            <td>{{ reg.duracao }}</td>
            <td>{{ reg.data_inicio }}</td>
            <td>{{ reg.cargaHoraria }}h</td>
            <td> <a href="/academico/editar/curso/{{reg.codigo}}" class="btn btn-success">Editar</a>/
                <a href="/academico/deletar/curso/{{reg.codigo}}" class="btn btn-danger">Apagar</a>/
                <a href="/academico/visualizar/curso/{{reg.codigo}}" class="btn btn-primary">Ver</a>
            </td>
        </tr>
    {%endfor%}
    </table>
</div>
</body>
</html>
