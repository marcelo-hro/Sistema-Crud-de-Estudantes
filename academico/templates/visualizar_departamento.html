<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Departamento</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5 bg-light p-4 shadow-sm" style="max-width: 600px; border-radius: 10px; border: 1px solid #ccc;">
    <h1 class="text-center bg-info text-white p-2 rounded mb-4">Detalhes do Departamento</h1>
    
    <div class="text-center mb-4">
        {% if departamento.imagem %}
            <img src="/midia/{{ departamento.imagem }}" class="rounded-circle shadow-sm" height="150px" width="150px" style="border: 3px solid #17a2b8;">
        {% else %}
            <div class="text-muted border rounded-circle d-inline-flex justify-content-center align-items-center bg-white" style="height: 150px; width: 150px;">Sem Imagem</div>
        {% endif %}
    </div>

    <ul class="list-group">
        <li class="list-group-item"><strong>Código:</strong> {{ departamento.codigo }}</li>
        <li class="list-group-item"><strong>Nome do Departamento:</strong> {{ departamento.nome }}</li>
    </ul>

    <div class="text-center mt-4">
        <a href="/editar/departamento/{{ departamento.codigo }}" class="btn btn-success">Editar Departamento</a>
        <a href="/listar/departamento/" class="btn btn-secondary">Voltar para a Lista</a>
    </div>
</div>
</body>
</html>
