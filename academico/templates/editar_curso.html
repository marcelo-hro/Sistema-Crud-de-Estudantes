<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Curso</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
</head>
<body>
<div class="w-50 m-auto p-4 bg-light shadow-sm mt-5" style="border-radius: 10px;">
    <h1 class="text-center m-4 p-2 bg-info text-white rounded"> Editar Curso </h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        
        <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            <a href="/listar/curso" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
