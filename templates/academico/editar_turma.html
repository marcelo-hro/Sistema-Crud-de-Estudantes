<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Turma</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5 p-4 bg-light shadow-sm" style="max-width: 600px; border-radius: 10px; border: 1px solid #ccc;">
    <h1 class="text-center m-4 p-2 bg-success text-white rounded">Editar Turma</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="text-center mt-4">
            <button type="submit" class="btn btn-success">Atualizar Turma</button>
            <a href="/listar/turma" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
