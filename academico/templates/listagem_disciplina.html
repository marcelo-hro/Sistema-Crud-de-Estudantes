<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Listagem de Disciplinas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5 bg-light" style="border:1px solid ; background-color:#1111; border-radius: 10px;">
    <h1 class="m-4 text-center">Registros de Disciplinas <a href="/academico/adicionar/disciplina/" class="btn btn-primary">Adicionar Disciplina</a></h1>
    <table class="table table-bordered">
        <tr class="bg-info text-white text-center">
            <td> ID </td>
            <td> Nome da Disciplina </td>
            <td> Carga Horária </td>
            <td> Turma </td>
            <td> Professor </td>
            <td> Ações </td>
        </tr>
        {% for disciplina in registros %}
        <tr class="text-center">
            <td>{{ disciplina.id }}</td>
            <td>{{ disciplina.nome }}</td>
            <td>{{ disciplina.cargaHoraria }}h</td>
            <td>{{disciplina.turma}}</td>
            <td>{{ disciplina.professor.nome }}</td>
            <td> 
                <a href="/academico/editar/disciplina/{{ disciplina.id }}/" class="btn btn-success">Editar</a>/
                <a href="/academico/deletar/disciplina/{{ disciplina.id }}/" class="btn btn-danger">Apagar</a>/
                <a href="/academico/visualizar/disciplina/{{ disciplina.id }}/" class="btn btn-primary">Ver</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
</body>
</html>
