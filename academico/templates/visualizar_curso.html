<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Visualizar Curso</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container-fluid my-5">
    <div class="w-50 m-auto p-4 bg-info" style="border-radius: 10px;">
        <h2 class="text-center mt-2 mb-4 text-white"> Dados do Curso</h2>
        <table class="table bg-white">
            <tr>
                <th>Código</th>
                <td>{{ curso.codigo }}</td>
            </tr>
            <tr>
                <th>Foto</th>
                <td>
                    {% if curso.foto %}
                        <img src="/midia/{{ curso.foto }}" class="rounded d-block" height="100px" width="120px">
                    {% else %}
                        Sem foto
                    {% endif %}
                </td>
            </tr>
            <tr>
                <th>Nome</th>
                <td>{{ curso.nome }}</td>
            </tr>
            <tr>
                <th>Duração</th>
                <td>{{ curso.duracao }}</td>
            </tr>
            <tr>
                <th>Data de Início</th>
                <td>{{ curso.data_inicio|date:"d/m/Y" }}</td>
            </tr>
            <tr>
                <th>Carga Horária</th>
                <td>{{ curso.cargaHoraria }}h</td>
            </tr>
        </table>
        
        <div class="text-center mt-3">
            <a href="/academico/listar/curso" class="btn btn-success"> Voltar </a>
        </div>
    </div>
</div>
</body>
</html>
